; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_feather_nrf52840_sense]
platform = nordicnrf52@^10.10.0
board = adafruit_feather_nrf52840_sense
framework = arduino
lib_ldf_mode = deep+
monitor_speed = 115200
monitor_filters = time
monitor_rts = 1
monitor_dtr = 1

; ============================================================
; Load Cell Backend Selection
; ============================================================
; Uncomment ONE of these build_flags to select the load cell ADC:
;   -D LOADCELL_BACKEND_HX711    = GPIO bit-bang HX711 (default)
;   -D LOADCELL_BACKEND_NAU7802  = I2C NAU7802 (shares bus with IMU)
;
; HX711:    Requires external HX711 module. Pins defined in main.cpp.
; NAU7802:  Uses I2C (Wire) - same bus as LSM6DS3TRC IMU.
; ============================================================
build_flags =
  -D LOADCELL_BACKEND_NAU7802
  ; -D LOADCELL_BACKEND_HX711

lib_deps =
  adafruit/Adafruit LSM6DS @ ^4.7.4
  adafruit/Adafruit LIS3MDL @ ^1.2.5
  adafruit/Adafruit BusIO @ ^1.17.4
  adafruit/Adafruit Unified Sensor @ ^1.1.15
  adafruit/Adafruit NAU7802 Library @ ^1.0.8